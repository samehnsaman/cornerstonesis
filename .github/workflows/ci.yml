name: Build and test
on: {push: {}, pull_request: {}}
permissions: {contents: read, packages: write}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install PHP dependencies in pinned container
        run: docker run --rm -v "$PWD:/app" -w /app composer:2 composer install --no-interaction --prefer-dist
      - run: cp .env.testing .env
      - name: Run Laravel tests in pinned container
        run: docker run --rm -v "$PWD:/app" -w /app composer:2 php artisan test --do-not-cache-result
      - uses: actions/setup-node@v5
        with: {node-version: '22', cache: npm}
      - run: npm ci && npm run build
  image:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-24.04-arm
    strategy: {matrix: {target: [app, web]}}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}'}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: '${{ matrix.target }}'
          push: true
          tags: 'ghcr.io/${{ github.repository }}/sis-${{ matrix.target }}:${{ github.sha }}'
