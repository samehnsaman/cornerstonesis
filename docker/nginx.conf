server { listen 8080; server_name _; root /var/www/public; index index.php; client_max_body_size 24m;
 location = /healthz { access_log off; return 200 'ok'; add_header Content-Type text/plain; }
 location / { try_files $uri $uri/ /index.php?$query_string; }
 location ~ \.php$ { include fastcgi_params; fastcgi_param SCRIPT_FILENAME /var/www/public/index.php; fastcgi_param HTTP_X_FORWARDED_PROTO https; fastcgi_pass app:9000; }
 location ~ /\. { deny all; }
}
